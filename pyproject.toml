[project]
name = "labs"
version = "0.1.0"
description = "Algorithmic mini-package for MAI Python lab 4"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["algolab*"]
